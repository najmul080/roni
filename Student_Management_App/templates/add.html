<!DOCTYPE html>
<html>
<head>
    <title>Add Student</title>
    <style>
        body { font-family:Arial; background:#f5f5f5; }
        .container { width:400px; margin:80px auto; background:white; padding:30px; border-radius:10px; }
        input { width:100%; padding:10px; margin-top:5px; margin-bottom:15px; box-sizing:border-box; }
        button { width:100%; padding:12px; background:green; color:white; border:none; cursor:pointer; }
        .back { display:block; text-align:center; margin-top:20px; }
    </style>
</head>
<body>
<div class="container">
    <h2>Add New Student</h2>
    <form method="POST">
        <label>Student Name</label>
        <input type="text" name="name" placeholder="Enter student name" required>
        <label>Email</label>
        <input type="email" name="email" placeholder="Enter email" required>
        <label>Department</label>
        <input type="text" name="department" placeholder="Enter department" required>
        <button type="submit">Add Student</button>
    </form>
    <a class="back" href="/">← Back to Home</a>
</div>
</body>
</html>
