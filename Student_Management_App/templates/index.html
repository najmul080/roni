<!DOCTYPE html>
<html>
<head>
    <title>Student Management System</title>
    <style>
        body { font-family: Arial; margin: 40px; background:#f5f5f5; }
        h1 { text-align:center; }
        .container { width:80%; margin:auto; background:white; padding:30px; border-radius:10px; }
        .add-button { display:inline-block; background:green; color:white; padding:10px 20px;
                      text-decoration:none; border-radius:5px; margin-bottom:20px; }
        table { width:100%; border-collapse:collapse; }
        th,td { border:1px solid #ddd; padding:12px; text-align:center; }
        th { background:#333; color:white; }
        .delete { background:red; color:white; padding:6px 10px; text-decoration:none; border-radius:4px; }
    </style>
</head>
<body>
<div class="container">
    <h1>Student Management System</h1>
    <a class="add-button" href="/add">+ Add Student</a>
    <table>
        <tr><th>ID</th><th>Name</th><th>Email</th><th>Department</th><th>Action</th></tr>
        {% for student in students %}
        <tr>
            <td>{{ student.id }}</td>
            <td>{{ student.name }}</td>
            <td>{{ student.email }}</td>
            <td>{{ student.department }}</td>
            <td><a class="delete" href="/delete/{{ student.id }}"
                   onclick="return confirm('Delete this student?')">Delete</a></td>
        </tr>
        {% endfor %}
    </table>
</div>
</body>
</html>
